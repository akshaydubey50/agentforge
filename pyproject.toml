[project]
name = "agentforge"
version = "0.2.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
# Discovers both packages in this repo: agentsys (agent orchestration) and
# rag (hybrid-search retrieval + eval). They share an environment but not a
# namespace -- neither imports the other directly; the agent reaches the RAG
# pipeline the same way any external caller would.
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
