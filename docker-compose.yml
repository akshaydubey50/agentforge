services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agentsys
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agentsys"]
      interval: 3s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10

  chroma:
    image: chromadb/chroma:0.5.11
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/chroma/chroma

  # One-shot: runs `alembic upgrade head` and exits, same
  # depends_on/service_completed_successfully pattern as rag-seed below.
  # Migrations must run from exactly ONE place, not from both api and
  # worker's own startup commands -- two containers racing to
  # `CREATE TABLE alembic_version` against a fresh database is a genuine
  # UniqueViolation, not a benign idempotent no-op (found the hard way: api
  # and worker starting together against a brand-new DB, worker's migration
  # won the race and api's crashed on the duplicate). api's own Dockerfile
  # CMD still runs `alembic upgrade head` too, but only for Railway's
  # single-service deploy, which has no separate migrate service to depend
  # on -- here, by the time api starts, this has already finished, so that
  # second run is just a fast idempotent no-op, not a second real migration.
  migrate:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg://agent:agent@postgres:5432/agentsys"
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  api:
    build: .
    ports:
      - "8100:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg://agent:agent@postgres:5432/agentsys"
      REDIS_URL: "redis://redis:6379/0"
      CHROMA_HOST: "chroma"
      CHROMA_PORT: "8000"
      WORKSPACE_DIR: "/app/data/workspace"
      RAG_API_URL: "http://rag-api:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    build: .
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql+psycopg://agent:agent@postgres:5432/agentsys"
      REDIS_URL: "redis://redis:6379/0"
      CHROMA_HOST: "chroma"
      CHROMA_PORT: "8000"
      WORKSPACE_DIR: "/app/data/workspace"
      RAG_API_URL: "http://rag-api:8000"
      WORKER_CONCURRENCY: "${WORKER_CONCURRENCY:-4}"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # prefork (not solo/threads/gevent) for two reasons that are really one
    # decision: an agent task spends most of its wall clock blocked on the
    # model API, so serial execution (the old --pool=solo) wasted almost
    # everything -- and Celery's HARD time limit (worker.py's
    # task_time_limit) can only force-kill a task on prefork, where each
    # task owns a child process. On any other pool the hard limit is inert
    # and a hung task runs forever. Concurrency is processes, so raising it
    # costs real memory (each in-flight task holds its own graph state);
    # 4 is a conservative default, tune via WORKER_CONCURRENCY.
    command: ["sh", "-c", "celery -A agentsys.worker.celery_app worker --loglevel=info --pool=prefork --concurrency=${WORKER_CONCURRENCY:-4}"]

  dashboard:
    build: .
    ports:
      - "8601:8501"
    env_file:
      - .env
    environment:
      AGENTSYS_API_URL: "http://api:8000"
    volumes:
      - ./data:/app/data
    depends_on:
      - api
    command: ["streamlit", "run", "src/agentsys/dashboard.py", "--server.address=0.0.0.0", "--server.port=8501"]

  # ---------------------------------------------------------------------
  # rag: hybrid-search retrieval pipeline. Shares this repo's image and
  # .env, but is otherwise independent of agentsys -- it has no database,
  # queue, or Chroma-server dependency, because it uses Chroma in embedded
  # mode against ./data/chroma rather than the chroma service above.
  # ---------------------------------------------------------------------

  # One-shot: builds the three chunking-strategy indexes from data/raw.
  # rag-api waits for this to finish successfully before starting.
  rag-seed:
    build: .
    env_file:
      - .env
    environment:
      CHROMA_PERSIST_DIR: "/app/data/chroma"
    volumes:
      - ./data:/app/data
    command: ["python", "scripts/run_ingest.py", "--strategy", "all"]

  rag-api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CHROMA_PERSIST_DIR: "/app/data/chroma"
    volumes:
      - ./data:/app/data
    depends_on:
      rag-seed:
        condition: service_completed_successfully
    command: ["uvicorn", "rag.main:app", "--host", "0.0.0.0", "--port", "8000"]

  rag-dashboard:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      RAG_API_URL: "http://rag-api:8000"
      CHROMA_PERSIST_DIR: "/app/data/chroma"
    volumes:
      - ./data:/app/data
    depends_on:
      - rag-api
    command: ["streamlit", "run", "src/rag/simple_upload.py", "--server.address=0.0.0.0", "--server.port=8501"]

volumes:
  pgdata:
  chromadata:
